services:
  python_app:
    build:
      context: ../../python_app
      dockerfile: Dockerfile
      target: production
    container_name: python_app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - nats
    volumes:
      - ../../python_app:/app
    labels:
      com.docker.compose.watch: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      retries: 3
      start_period: 5s
      timeout: 5s
